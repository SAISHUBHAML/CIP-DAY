 const lab=n=>{const p=!isT&&P.find(p=>p[0]===n);return p?n+" ("+p[3]+")":n};
 const sel=i=>`<select data-s="${i}" aria-label="Round 1, slot ${i+1}"><option value="">Select ${isT?"team":"player"}...</option>${pool.filter(n=>n===sl[i]||!sl.includes(n)).map(n=>`<option value="${esc(n)}"${n===sl[i]?" selected":""}>${esc(lab(n))}</option>`).join("")}<option value="BYE"${sl[i]==="BYE"?" selected":""}>BYE (no opponent)</option></select>`;
 h+=`<div class="box"><div class="bh"><h2>Knockout bracket</h2>${edit?`<span class="act"><button data-a="dm">${dm?"Done placing":"Edit draw"}</button></span>`:""}</div>${dm?`<p class="small">Choose who goes in each first-round slot${isT?"":" (M or F is shown next to each name)"}. Pick BYE where there is no opponent. Use "Add match" and "Delete match" to change how many first-round matches there are; the later rounds adjust on their own. Set a match's date and time in the box above its players. To reorder, drag a match by its "Match" strip or use the arrows. Press "Done placing" to start recording winners.</p>`:""}<div class="br">`+R.map((r,ri)=>`<div class="rd"><h4>${rname(r.length,ri)}</h4>${r.map((m,mi)=>{
  const c=x=>x==="BYE"?"bye":x==="TBD"?"tbd":m.w?(m.w===x?"win":"lose"):"";
  const ok=x=>edit&&x!=="TBD"&&x!=="BYE"&&!m.bye&&m.a!=="TBD"&&m.b!=="TBD";
  const pb=x=>`<button class="pl ${c(x)}" ${ok(x)?`data-k="${m.k}" data-n="${esc(x)}"`:"disabled"}>${esc(x)}</button>`;
  const tt=tm(g,m.k)?`<div class="tm">${fmt(tm(g,m.k))}</div>`:"";
  const tin=`<input type="datetime-local" class="ti" data-t="${m.k}" value="${esc(tm(g,m.k))}" aria-label="Date and time, ${rname(r.length,ri)} match ${mi+1}">`;
  if(dm&&!ri)return `<div class="m" data-mt="${mi}"><div class="dh" draggable="true" data-m="${mi}" title="Drag to move this match"><span>⠿ Match ${mi+1}</span><span><button data-a="mvu" data-i="${mi}" aria-label="Move match ${mi+1} up"${mi?"":" disabled"}>▲</button><button data-a="mvd" data-i="${mi}" aria-label="Move match ${mi+1} down"${mi<r.length-1?"":" disabled"}>▼</button></span></div>${tin}${sel(2*mi)}${sel(2*mi+1)}${r.length>1?`<button class="dl" data-a="delm" data-i="${mi}" aria-label="Delete match ${mi+1}">Delete match</button>`:""}</div>`;
  return `<div class="m ${!m.bye&&!m.w&&m.a!=="TBD"&&m.b!=="TBD"?"rdy":""}">${dm&&!m.bye?tin:tt}${pb(m.a)}${pb(m.b)}</div>`}).join("")}${dm&&!ri?'<button class="am" data-a="addm">+ Add match</button>':""}</div>`).join("")+"</div></div>"+pn+sch;
 h+=tail(g,L,X);
 return h}

 if(a==="mkt"){if(played(view))return;const sz=Math.max(2,Math.min(20,Math.round(+document.getElementById("ts").value)||SZ[view])),nm=mk(view).map(p=>p[0]),u=unit(view),n=Math.max(2,Math.round(nm.length/sz));
  for(let i=nm.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nm[i],nm[j]]=[nm[j],nm[i]]}

 if(b.dataset.v){view=b.dataset.v;q="";tmsg="";dmode=null;render();window.scrollTo(0,0)}
 else if(b.dataset.k){const W=S.win[view]=S.win[view]||{};if(W[b.dataset.k]===b.dataset.n)delete W[b.dataset.k];else W[b.dataset.k]=b.dataset.n;save();render()}
 else if(a==="addm"||a==="delm"){const sl=slots(view),dt=dtimes(view),W=S.win[view]=S.win[view]||{},i=+b.dataset.i;
  if(a==="addm"){sl.push("","");dt.push("")}

   if(!confirm("Delete this first-round match"+(who.length?" ("+who.join(" vs ")+")":"")+"? "+(who.length?"They go back to the unplaced list. ":"")+"Later rounds will be rebuilt."))return;
   sl.splice(2*i,2);dt.splice(i,1);
   // keep first-round results with their matches; later rounds are re-paired, so their results start again
   const N={};Object.keys(W).forEach(k=>{if(!k.startsWith("0-"))return;const j=+k.slice(2);if(j!==i)N["0-"+(j>i?j-1:j)]=W[k]});S.win[view]=N}
  S.draw[view]=sl;S.dt[view]=dt;dmode=true;save();render()}
 else if(a==="addp")addPlayer();
 else if(a==="delxp"){const L=xp(view),o=L[+b.dataset.i];if(o&&confirm('Remove "'+o.n+'" from this game?')){L.splice(+b.dataset.i,1);S.xp[view]=L;const M=S.mem[view]||{};Object.keys(M).forEach(t=>{if(Array.isArray(M[t]))M[t]=M[t].filter(n=>n!==o.n)});save();render()}}
 else if(a==="delp"){const t=ex(view)[+b.dataset.i],M=S.mem[view];if(t&&M&&Array.isArray(M[t])){M[t]=M[t].filter(n=>n!==b.dataset.n);save();render()}}
 else if(a==="mvu"||a==="mvd"){const i=+b.dataset.i;moveMatch(i,a==="mvu"?i-1:i+1)}
 else if(a==="ltm"){ltmode=!ltmode;render()}
 else if(a==="dm"){dmode=!(dmode===null?slots(view).every(x=>!x):dmode);render()}
});

 else if(d.lt!==undefined){(S.lt[view]=S.lt[view]||{})[d.lt]=iso(e.target.value);save()}});
let dragM=null;const over=t=>document.querySelectorAll(".m.over").forEach(x=>x!==t&&x.classList.remove("over")),card=e=>dragM!==null&&e.target.closest?e.target.closest("[data-mt]"):null;
